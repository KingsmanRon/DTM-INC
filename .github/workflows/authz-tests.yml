name: AuthZ / RLS tests

# Boots a throwaway local Supabase database, applies EVERY migration from
# scratch (which itself proves the repo is self-containedly rebuildable —
# review item 5), then runs the pgTAP authz suite in supabase/tests/.
#
# Kept as a separate workflow from the release gate: it needs Docker and takes
# minutes. NEW HARNESS — if the first run trips on CLI/config details, fix
# forward; do not delete the suite.

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/**"
      - "config/**"
      - "package*.json"
      - ".github/workflows/authz-tests.yml"
  push:
    branches: ["main", "master", "claude/patient-onboarding-pwa-PFlAh"]
    paths:
      - "supabase/**"
      - "scripts/**"
      - "config/**"
      - "package*.json"
      - ".github/workflows/authz-tests.yml"

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local database (applies all migrations from 0001)
        run: supabase db start

      - name: Run pgTAP authz suite
        run: supabase test db

      - name: Verify client bootstrap against empty local database
        run: npm run test:bootstrap

      - name: Local security advisors
        run: supabase db advisors --local --type security --fail-on warn

      - name: Database function lint
        run: supabase db lint --local --schema public,private --fail-on error
