name: Release Gate

on:
  pull_request:
  push:
    # The de-facto production branch is claude/patient-onboarding-pwa-PFlAh
    # (Vercel deploys it on push), so direct pushes there MUST run the gate.
    # main/master kept for an eventual branch rename.
    branches: ["main", "master", "claude/patient-onboarding-pwa-PFlAh"]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (with cache)
        if: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Node.js (no cache)
        if: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (lockfile)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Install dependencies (no lockfile)
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Canonical SQL functions match migrations
        run: npm run check:functions

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Production and validation use Node 22, matching file-type and Vitest.
  mime-sniff-node22:
    name: MIME sniff (Node 22 parity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify document MIME sniffing on Node 22
        run: npm run test -- src/lib/documents
